<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0B0B11" />
  <title>Hors ligne — Miabe Esport</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0B0B11; color: #F4F5FB; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    .card { max-width: 380px; }
    img { width: 96px; height: 96px; border-radius: 22px; border: 1px solid #282838; }
    h1 { margin: 20px 0 8px; font-size: 26px; letter-spacing: .5px; }
    p { margin: 0 0 22px; color: #8E8FA6; line-height: 1.6; font-size: 15px; }
    button { background: linear-gradient(135deg, #22D3EE, #12aec4); color: #04222a; border: 0; border-radius: 12px; padding: 13px 26px; font-weight: 750; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/pwa-icon/192" alt="Miabe Esport" />
    <h1>Tu es hors ligne</h1>
    <p>Impossible de joindre Miabe Esport pour le moment. Vérifie ta connexion internet, puis réessaie.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
